name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: npm run lint

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test tests/core/differ.test.js tests/core/generator.test.js tests/core/mock-generator.test.js tests/core/yaml-parser.test.js tests/watch-graphql.test.js

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: deno test --allow-read --allow-write --allow-env tests/core/differ.test.js tests/core/generator.test.js tests/core/mock-generator.test.js tests/core/yaml-parser.test.js tests/watch-graphql.test.js
